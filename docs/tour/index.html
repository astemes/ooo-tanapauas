<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone-Free Pet Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap">
<style>
  /* Layout: one 16:9 stage (the box's own world, drawn on canvas), caption and transport below.
     Deliberately single-theme: the box screen is always dark. */
  :root {
    --night: #17141c;     /* page ground, a shade under the box screen */
    --screen: #1e1b24;    /* the GIGA display background */
    --panel: #2a2632;
    --ink: #f4f1e8;
    --muted: #a7a1b2;
    --teal: #26c6b5;
    --gold: #ffc94d;
    --display: "Silkscreen", "Courier New", monospace;
    --body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  body { background: var(--night); color: var(--ink); font-family: var(--body); }
  .wrap {
    max-width: 1100px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 32px;
    display: flex; flex-direction: column; gap: 14px;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(18px, 3vw, 26px); margin: 0; letter-spacing: 0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .stage {
    width: 100%; max-width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 14px;
    background: var(--screen); box-shadow: 0 0 0 2px #2f2a38, 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .caption { display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
  .caption b { font-family: var(--display); font-weight: 400; font-size: 15px; color: var(--teal); letter-spacing: 0.04em; }
  .caption span { font-size: 15px; line-height: 1.45; max-width: 68ch; }
  .transport { display: flex; align-items: center; gap: 12px; }
  .transport button {
    font: 600 14px var(--body); color: var(--ink); background: var(--panel); border: 2px solid #3a3544;
    border-radius: 10px; padding: 8px 14px; cursor: pointer; min-width: 84px;
  }
  .transport button:focus-visible, .seg:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .time { font: 600 13px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .timeline { display: flex; gap: 4px; }
  .seg {
    flex: var(--len) 1 0; min-width: 0; background: none; border: 0; padding: 6px 0 0; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--muted);
  }
  .seg i { display: block; height: 6px; border-radius: 3px; background: #3a3544; position: relative; overflow: hidden; }
  .seg i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--fill, 0%); background: var(--teal); }
  .seg span { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg.on span { color: var(--ink); }
  @media (max-width: 600px) { .seg span { display: none; } }
  .player { display: flex; flex-direction: column; gap: 14px; }
  /* Fullscreen: the stage fills the screen, with the caption and controls below it. */
  .player:fullscreen {
    background: #000; justify-content: center; align-items: center; gap: 10px;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
      max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  /* Fullscreen shows only the scene and the progress bar; Space, F and Esc still work. */
  .player:fullscreen .stage, .player:fullscreen .timeline { width: min(100%, calc((100vh - 48px) * 16 / 9)); }
  .player:fullscreen .stage { border-radius: 0; box-shadow: none; }
  .player:fullscreen .caption, .player:fullscreen .transport, .player:fullscreen .seg span { display: none; }
  .note { font-size: 13px; color: var(--muted); }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Phone-Free Pet Box</h1>
    <p>A two-minute tour &middot; drawn with the box&rsquo;s own sprites</p>
  </header>
  <div class="player" id="player">
  <canvas class="stage" id="stage" width="1280" height="720" aria-label="Animated tour of the pet box"></canvas>
  <div class="caption" aria-live="polite"><b id="capTitle"></b><span id="capText"></span></div>
  <div class="timeline" id="timeline"></div>
  <div class="transport">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <button id="full" type="button">Fullscreen</button>
    <span class="time" id="time">0:00 / 2:00</span>
  </div>
  </div>
</div>

<script>
const P = {"bodies":[["................","......####......",".....#wwww#.....","....#wwwwww#....","...#wwaawwww#...","...#wwwwwwww#...","..#wwwwwwaaww#..","..#wwwwwwaaww#..","..#waawwwwwww#..","..#waawwwwwww#..","..#wwwwwwwwww#..","...#wwwwwwww#...","...#swwwwwws#...","....#ssssss#....",".....######.....","................"],["................","................","................","................","................","......####......","....##oooo##....","...#oooooooo#...","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..","..#soooooooos#..","...#ssssssss#...","....########....","................"],["................","................","................",".....######.....","...##oooooo##...","..#oooooooooo#..",".#oooooooooooo#.",".#oooooooooooo#.",".#oooooooooooo#.",".#oooooooooooo#.",".#oooooooooooo#.",".#soooooooooos#.","..#ssssssssss#..","...#oo####oo#...","...#ss#..#ss#...","....##....##...."],["................","................","................","....########....","...#oooooooo#...","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..",".##oooooooooo##.","#oo#oooooooo#oo#",".##soooooooos##.","...#ssssssss#...","...#oo#..#oo#...","...#ss#..#ss#...","....##....##...."],["................","................","................",".....######.....","...##oooooo##...","..#oooooooooo#..",".#oooooooooooo#.",".#oooooooooooo#.",".#oooooooooooo#.",".#oooooooooooo#.","#oooowwwwwwoooo#","#ooowwwwwwwwooo#",".#soowwwwwwoos#.","..#ssssssssss#..","..#oo#....#oo#..","..####....####.."],["................","................","................",".....######.....","...##oooooo##...","..#oooooooooo#..",".#oooooooooooo#.",".#oooooooooooo#.",".#oooooooooooo#.",".#owwwwwwwwwwo#.","#oowwwwwwwwwwoo#","#oooowwwwwwoooo#",".#sooowwwwooos#.","..#ssssssssss#..","..#oo#....#oo#..","..####....####.."]],"tombstone":["................","................",".....######.....","....#ssssss#....","...#sss##sss#...","...#s######s#...","...#sss##sss#...","...#sss##sss#...","...#ssssssss#...","...#ssssssss#...","...#ssssssss#...","...#ssssssss#...",".aa##########aa.","aaaaaaaaaaaaaaaa","................","................"],"faces":[[".#....#.","p......p","..#..#..","...##..."],[".#....#.","p......p","...##...","........"],[".#....#.","........","...##...","..#..#.."],["##....##",".t....t.",".t.##.t.","..#..#.."],["##....##","........","...##...","........"]],"closedEyes":"##....##","faceAt":[[0,0],[4,8],[4,6],[4,5],[4,6],[4,6]],"heart":[".##..##.","#xx##xx#","#xxxxxx#","#xxxxxx#",".#xxxx#.","..#xx#..","...##...","........"],"bodyColour":["F4F1E8","FFD84D","7ED957","4DA6FF","FF9A3C","B98CFF"],"palette":{"outline":"2B2233","white":"F7F4EE","cheek":"FF8FA3","tear":"5BC0FF","heartFull":"FF4D6D","heartEmpty":"5A5560","eggShade":"CFC8B8","eggAccent":"8FD3C8"},"featureY":[0,2,0,0,0,0],"species":[{"name":"Blob","rarity":"Common","body":null,"accent":"FFE066","feature":null},{"name":"Chick","rarity":"Common","body":"FFD84D","accent":"FF9A3C","feature":["......#..#......",".....#a##a#.....","......#aa#......","......#aa#......","................","................","................"]},{"name":"Bunny","rarity":"Common","body":"EDE6F2","accent":"FF8FA3","feature":["...##......##...","..#oa#....#ao#..","..#oa#....#ao#..","..#oa#....#ao#..","...#o#....#o#...","................","................"]},{"name":"Frog","rarity":"Common","body":"7ED957","accent":"F7F4EE","feature":["................","...###....###...","..#oao#..#oao#..","..#ooo#..#ooo#..","..#oooo##oooo#..","................","................"]},{"name":"Cat","rarity":"Uncommon","body":"A7A1B2","accent":"FF8FA3","feature":["................","...#........#...","..#a#......#a#..","..#aa#....#aa#..","..#ooo#..#ooo#..","................","................"]},{"name":"Bear","rarity":"Uncommon","body":"B07A45","accent":"E8C090","feature":["................","................","...###....###...","..#oaa#..#aao#..","..#oo#....#oo#..","................","................"]},{"name":"Pig","rarity":"Uncommon","body":"FFA8C0","accent":"E0708F","feature":["................","................","................","..##........##..",".#aa#......#aa#.",".#a#........#a#.","................"]},{"name":"Fox","rarity":"Rare","body":"FF8A3C","accent":"F7F4EE","feature":["..#..........#..","..#o#......#o#..","..#ao#....#oa#..","..#aao#..#oaa#..","..#ooo#..#ooo#..","................","................"]},{"name":"Panda","rarity":"Rare","body":"F4F1E8","accent":"5A5464","feature":["................","................","...###....###...","..#aaa#..#aaa#..","..#aa#....#aa#..","................","................"]},{"name":"Axolotl","rarity":"Rare","body":"FF9FC8","accent":"E0457B","feature":["................","................","a.a..........a.a",".aa#........#aa.","aaa#........#aaa",".a#..........#a.","................"]},{"name":"Deer","rarity":"Rare","body":"C98F5A","accent":"F0DDB8","feature":["..a.a......a.a..","..aaa......aaa..","...a........a...","....aa....aa....","................","................","................"]},{"name":"Dragon","rarity":"Legendary","body":"3FBF8F","accent":"FFC94D","feature":["..#..........#..","..#a#......#a#..","...#a#....#a#...","....#a#..#a#....","................","................","................"]},{"name":"Unicorn","rarity":"Legendary","body":"F1EAFF","accent":"FFC94D","feature":["........#.......",".......#a#......","..#...#aa#...#..","..#o#.#aa#.#o#..","..#oo#....#oo#..","................","................"]}]};

// ---- scenes: [seconds, title, caption] ------------------------------------------
const SCENES = [
  [14, "The problem", "We live in an epidemic where attention is being hijacked by phones, social media and screens."],
  [8, "The idea", "A shared pixel pet that only grows while everyone's phones are docked in the box."],
  [12, "Pick an egg, dock your phones", "The egg's time is the goal of every session, and longer eggs hatch rarer pets. When every phone is docked, the countdown starts by itself."],
  [14, "Count down to the goal", "The timer counts down to the egg's goal while it hatches into a random animal and grows."],
  [14, "The double-time challenge", "Goal complete! Keep going until double the time and the pet earns an extra life."],
  [18, "The companion app", "Scan the box's QR code: every player's phone shows the pet, the live timer, the group and a calendar of phone-free days."],
  [14, "Somebody lifts a phone", "Picking a phone up mid-session ends it for everyone: a lost heart and a spot on the wall of shame."],
  [10, "Extras", "Each egg hatches into one of 13 animals, and friends can compare their pets and phone-free minutes."],
  [16, "Put the phone down", "Arduino GIGA R1 WiFi with the Display Shield. The box serves the app over Wi-Fi."],
];
const STARTS = [];
let total = 0;
for (const s of SCENES) { STARTS.push(total); total += s[0]; }

// ---- pixel pets (port of lib/petcore/src/sprites.cpp) ----------------------------
const MOOD = { Happy: 0, Content: 1, Sad: 2, Crying: 3, Dead: 4 };
function renderPet(species, stage, mood, frame) {
  const out = Array.from({ length: 16 }, () => Array(16).fill("."));
  const blit = (art, w, h, dx, dy, skip) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const tx = x + dx, ty = y + dy;
      if (tx < 0 || ty < 0 || tx >= 16 || ty >= 16) continue;
      const c = art[y][x];
      if (skip && c === ".") continue;
      out[ty][tx] = c;
    }
  };
  if (mood === MOOD.Dead) { blit(P.tombstone, 16, 16, 0, 0, false); return out; }
  if (stage === 0) {
    const dx = mood === MOOD.Sad ? 0 : frame % 4 === 1 ? -1 : frame % 4 === 3 ? 1 : 0;
    blit(P.bodies[0], 16, 16, dx, 0, false);
    return out;
  }
  const bob = mood <= 1 ? frame % 2 : frame % 4 === 0 ? 1 : 0;
  const feat = species !== null ? P.species[species].feature : null;
  if (feat) blit(feat, 16, feat.length, 0, P.featureY[stage] + bob, true);
  blit(P.bodies[stage], 16, 16, 0, bob, true);
  const rows = P.faces[Math.min(mood, 3)].slice();
  if (mood !== MOOD.Crying && frame % 8 === 7) rows[0] = P.closedEyes;
  const [ax, ay] = P.faceAt[stage];
  blit(rows, 8, 4, ax, ay + bob, true);
  return out;
}
function darken(hex) {
  const v = parseInt(hex, 16), ch = (s) => Math.floor((((v >> s) & 255) * 7) / 10);
  return ((ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).padStart(6, "0");
}
function colourFor(species, stage, c) {
  const sp = P.species[species ?? 0], pal = P.palette, body = sp.body ?? P.bodyColour[stage % 6];
  switch (c) {
    case "#": return pal.outline;
    case "o": return body;
    case "s": return stage === 0 ? pal.eggShade : darken(body);
    case "w": return pal.white;
    case "p": return pal.cheek;
    case "t": return pal.tear;
    case "a": return stage === 0 ? pal.eggAccent : sp.accent;
    default: return null;
  }
}
const petCache = new Map();
function petPixels(species, stage, mood, frame) {
  const key = species + "/" + stage + "/" + mood + "/" + (frame % 8);
  if (!petCache.has(key)) petCache.set(key, renderPet(species, stage, mood, frame).map((r) => r.map((c) => colourFor(species, stage, c))));
  return petCache.get(key);
}

// ---- canvas helpers ------------------------------------------------------------
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const W = 1280, H = 720;
function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (t) => { t = clamp(t); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const back = (t) => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
const pad2 = (n) => String(Math.floor(n)).padStart(2, "0");
const hms = (s) => { s = Math.max(0, Math.floor(s)); return `${pad2(s / 3600)}:${pad2((s / 60) % 60)}:${pad2(s % 60)}`; };

function rr(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function text(s, x, y, o = {}) {
  ctx.font = `${o.weight || 400} ${o.size || 16}px ${o.font || "Montserrat, sans-serif"}`;
  ctx.fillStyle = o.color || "#f4f1e8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "top";
  ctx.globalAlpha = o.alpha ?? 1;
  if (o.wrap) {
    const words = s.split(" "); let line = "", yy = y;
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > o.wrap && line) { ctx.fillText(line, x, yy); line = w; yy += (o.lh || o.size * 1.3); }
      else line = test;
    }
    ctx.fillText(line, x, yy);
  } else ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}
function sprite(px, x, y, scale, alpha = 1) {
  ctx.globalAlpha = alpha;
  for (let r = 0; r < px.length; r++) for (let c = 0; c < px[r].length; c++) {
    if (!px[r][c]) continue;
    ctx.fillStyle = "#" + px[r][c];
    ctx.fillRect(Math.round(x + c * scale), Math.round(y + r * scale), Math.ceil(scale), Math.ceil(scale));
  }
  ctx.globalAlpha = 1;
}
const pet = (species, stage, mood, frame, x, y, scale, alpha) => sprite(petPixels(species, stage, mood, frame), x, y, scale, alpha);
const HEART_FILL = { full: P.palette.heartFull, empty: P.palette.heartEmpty, bonus: "FFC94D" };
const heartPx = (kind) => P.heart.map((r) => [...r].map((c) => (c === "#" ? P.palette.outline : c === "x" ? HEART_FILL[kind] : null)));
function phone(x, y, w, h, colour, alpha = 1) {
  ctx.globalAlpha = alpha;
  rr(x, y, w, h, w * 0.18, "#0f0d13", colour);
  rr(x + w * 0.1, y + h * 0.08, w * 0.8, h * 0.78, w * 0.08, colour);
  ctx.globalAlpha = 1;
}

// ---- the box screen (800x480, same layout as firmware/src/ui/ui.cpp) ----------------
const SX = 240, SY = 140;
const NAMES = ["Anna", "Ben", "Cleo", "Dan"];
const C = { bg: "#1e1b24", panel: "#2a2632", muted: "#a7a1b2", empty: "#3a3542", docked: "#2f6fb0", locked: "#3e9b3a", lift: "#d6334f", gold: "#ffc94d", green: "#7ed957", teal: "#009688" };

function bar(x, y, w, h, v, colour) {
  rr(x, y, w, h, h / 2, "#3a3542");
  if (v > 0) rr(x, y, Math.max(h, w * clamp(v)), h, h / 2, colour);
}
// The bonus round: a pulsing gold fill drawn over the full green goal bar.
function glowBar(x, y, w, h, v, T) {
  if (v <= 0) return;
  ctx.save();
  ctx.shadowColor = "#ffc94d";
  ctx.shadowBlur = 10 + 10 * (0.5 + 0.5 * Math.sin(T * 4));
  rr(x, y, Math.max(h, w * clamp(v)), h, h / 2, "#ffc94d");
  ctx.restore();
}
function button(x, y, w, h, label, colour, o = {}) {
  rr(x, y, w, h, 10, colour);
  if (o.press) rr(x, y, w, h, 10, "rgba(255,255,255," + 0.35 * o.press + ")");
  text(label, x + w / 2, y + h / 2, { size: 20, weight: 600, align: "center", base: "middle", alpha: o.alpha ?? 1 });
}
function boxFrame() {
  // Bezel and the GIGA display behind the screen.
  rr(SX - 34, SY - 34, 868, 548, 26, "#0f0d13", "#2f2a38");
  rr(SX, SY, 800, 480, 4, C.bg);
  text("GIGA DISPLAY SHIELD", SX + 400, SY + 492, { size: 11, align: "center", font: "Silkscreen", color: "#4a4553" });
}
function header(st) {
  text(st.title, 24, 20, { size: 28, weight: 600 });
  for (let i = 0; i < 5; i++) {
    const kind = i < st.hearts ? (i >= 3 ? "bonus" : "full") : "empty";
    if (i >= 3 && i >= st.hearts && !st.ghost?.[i]) continue;
    const pop = st.pop?.[i] ?? 1;
    const s = 4 * pop, off = (32 - 8 * s) / 2;
    sprite(heartPx(kind), 290 + i * 36 + off, 20 + off, s, st.ghost?.[i] ?? 1);
  }
  // Plain numbers on the box; the progress bars live in the app.
  text(`Happy ${Math.round(st.happy * 100)}%`, 490, 24, { size: 20 });
  text(st.xpText.replace(/ \/ /, "/"), 630, 24, { size: 20 });
}
function slots(states, showLink) {
  for (let s = 0; s < 4; s++) {
    const st = states[s];
    rr(24 + s * 150, 400, 140, 64, 12, st.colour);
    const label = st.label || `${s + 1}  ${NAMES[s]}`;
    const two = label.length > 12;
    if (two) {
      const [a, ...b] = label.split("  ");
      text(a, 94 + s * 150, 410, { size: 18, weight: 600, align: "center" });
      text(b.join(" "), 94 + s * 150, 434, { size: 16, weight: 700, align: "center" });
    } else text(label, 94 + s * 150, 432, { size: 20, weight: 600, align: "center", base: "middle" });
  }
  if (showLink) button(630, 400, 146, 64, "Link phone", "#2f6fb0");
}
function dailyRows(mins) {
  for (let p = 0; p < 4; p++) {
    const y = 254 + p * 23;
    text(NAMES[p], 20, y + 3, { size: 14 });
    text(mins[p] >= 30 ? `${mins[p]}/30 done` : `${mins[p]}/30 min`, 130, y + 3, { size: 14 });
  }
}
function toast(msg, t, colour = C.gold) {
  if (t <= 0 || t >= 1) return;
  const a = Math.min(span(t, 0, 0.12), 1 - span(t, 0.85, 1));
  const y = -170 + 80 * back(span(t, 0, 0.18)); // floats above the box like a notification
  ctx.globalAlpha = a;
  ctx.font = "600 20px Montserrat, sans-serif";
  const w = ctx.measureText(msg).width + 48;
  rr(400 - w / 2, y, w, 48, 12, "#3a3544", colour);
  ctx.globalAlpha = 1;
  text(msg, 400, y + 24, { size: 20, weight: 600, align: "center", base: "middle", alpha: a });
}
function runningPanel(o) {
  rr(340, 84, 440, 300, 16, C.panel);
  text(o.status, 560, 98, { size: 20, weight: 700, align: "center", color: o.done ? C.green : C.muted });
  const zoom = o.zoom ?? 1;
  ctx.save(); ctx.translate(560, 168); ctx.scale(zoom, zoom);
  text(o.timer, 0, 0, { size: 64, weight: 800, align: "center", base: "middle" });
  ctx.restore();
  text(o.challenge, 560, 220, { size: 18, weight: 600, align: "center", color: C.gold, wrap: 400, lh: 24 });
  button(360, 300, 190, 64, o.left || "Emergency pass", "#b5651d");
  button(570, 300, 190, 64, o.right || "Stop early", "#5a5560", { press: o.press });
}

// ---- scenes ----------------------------------------------------------------------
const frameOf = (t) => Math.floor(t * 2); // the box animates at ~2 frames/s

function sceneIdea(t, T) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // Starfield of tiny pixels for atmosphere.
  for (let i = 0; i < 60; i++) {

function sceneBusted(t, T) {

// Many phones, each one pinging for attention.
function feedPhone(x, y, i, T, glow) {
  const hue = ["#4da6ff", "#ff8fa3", "#7ed957", "#ffc94d", "#b98cff"][i % 5];

  ctx.fillStyle = "#1a1720"; ctx.fillRect(x + 6, y + 10, 62, 108);
  // An endless feed scrolling past.
  const off = (T * (24 + (i % 4) * 9)) % 36;
  ctx.globalAlpha = glow;
  for (let k = -1; k < 5; k++) {
    const yy = y + 12 + k * 36 - off;
    rr(x + 10, yy, 54, 20, 4, hue);
    rr(x + 10, yy + 24, 34, 6, 3, "#3a3544");

}
function sceneProblem(t, T) {
  ctx.fillStyle = "#120f16"; ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 14; i++) {

    const a = span(t, 0.2 + i * 0.12, 0.6 + i * 0.12);

    const x = 640 - (7 * 96 - 22) / 2 + col * 96 + (row ? 48 : 0) - 24, y = 300 + row * 150;
    ctx.globalAlpha = a * dim;

    // Notification badges that keep counting up.
    const n = Math.min(99, Math.floor(Math.max(0, t - 0.8 - i * 0.1) * (2 + (i % 5))));
    if (n > 0) {
      const pulse = 1 + 0.15 * Math.max(0, Math.sin(T * 6 + i));
      ctx.globalAlpha = a * dim;
      ctx.beginPath(); ctx.arc(x + 70, y + 4, 15 * pulse, 0, Math.PI * 2); ctx.fillStyle = "#ff3b5c"; ctx.fill();
      ctx.globalAlpha = 1;
      text(String(n), x + 70, y + 4, { size: 13, weight: 800, align: "center", base: "middle", alpha: a * dim });
    }

  }
}

// De-emphasized extras: collecting animals and comparing with friends.
function sceneExtras(t, T) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  text("EXTRAS", 640, 70, { font: "Silkscreen", size: 30, weight: 700, align: "center", color: C.muted, alpha: span(t, 0, 0.6) });
  text("Every egg is a surprise", 340, 150, { size: 24, weight: 700, align: "center", alpha: span(t, 0.4, 1) });
  text("13 animals to collect in the app", 340, 186, { size: 16, align: "center", color: C.muted, alpha: span(t, 0.6, 1.2) });
  P.species.forEach((sp, i) => {
    const a = span(t, 0.8 + i * 0.15, 1.2 + i * 0.15);
    const col = i % 5, row = Math.floor(i / 5);
    pet(i, 2, 0, frameOf(T) + i, 340 - 2.5 * 96 + col * 96 + (row === 2 ? 96 : 0), 236 + row * 100, 5, a);
  });
  text("Compare with friends", 940, 150, { size: 24, weight: 700, align: "center", alpha: span(t, 1.6, 2.2) });
  text("phone-free minutes this week", 940, 186, { size: 16, align: "center", color: C.muted, alpha: span(t, 1.8, 2.4) });
  [["Maja", 654, 3, 4], ["Noor", 545, 1, 3], ["You", 176, 7, 3]].forEach(([name, min, sp, stage], i) => {
    const a = span(t, 2.4 + i * 0.4, 3 + i * 0.4);
    if (a <= 0) return;
    const y = 236 + i * 92;
    ctx.globalAlpha = a;
    rr(760, y, 360, 76, 14, C.panel, name === "You" ? "#26c6b5" : "#3a3544");
    ctx.globalAlpha = 1;
    pet(sp, stage, 0, frameOf(T) + i, 776, y + 6, 4, a);
    text(name, 852, y + 26, { size: 20, weight: 700, alpha: a });
    text(`${min} min`, 1100, y + 26, { size: 20, weight: 800, align: "right", alpha: a });
  });
}

function sceneOutro(t, T) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  text("PUT THE PHONE DOWN.", 640, 150, { font: "Silkscreen", size: 54, weight: 700, align: "center", alpha: span(t, 0, 1) });
  text("GROW SOMETHING TOGETHER.", 640, 222, { font: "Silkscreen", size: 30, align: "center", color: C.gold, alpha: span(t, 0.8, 1.8) });
  // Parade of every species walking across.
  const n = P.species.length;
  for (let i = 0; i < n; i++) {
    const x = ((T * 70 + i * 118) % (n * 118)) - 110;
    const hop = Math.abs(Math.sin(T * 6 + i)) * 10;
    pet(i, 2 + (i % 4), 0, frameOf(T) + i, x, 380 - hop, 6);
  }
  text("Arduino GIGA R1 WiFi  \u00B7  GIGA Display Shield  \u00B7  LVGL 8.3  \u00B7  companion app served by the box", 640, 560, { size: 18, align: "center", color: C.muted, alpha: span(t, 2, 3) });
  text("4 phones  \u00B7  1 shared pet  \u00B7  more time together", 640, 600, { size: 18, weight: 700, align: "center", alpha: span(t, 2.5, 3.5) });
}

const RENDER = [sceneProblem, sceneIdea, sceneDock, sceneGoal, sceneChallenge, sceneApp, sceneBusted, sceneExtras, sceneOutro];

// ---- playback ---------------------------------------------------------------------
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let time = 0, playing = !reduce, last = performance.now(), shownScene = -1;
const playBtn = document.getElementById("play");
const timeEl = document.getElementById("time");
const capTitle = document.getElementById("capTitle"), capText = document.getElementById("capText");
const timeline = document.getElementById("timeline");
const segs = SCENES.map(([len, title], i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "seg"; b.style.setProperty("--len", len);
  b.innerHTML = `<i></i><span>${title}</span>`;
  b.setAttribute("aria-label", `Jump to ${title}`);
  b.addEventListener("click", () => { time = STARTS[i] + 0.01; draw(); });
  timeline.appendChild(b);
  return b;
});
const fmt = (s) => `${Math.floor(s / 60)}:${pad2(s % 60)}`;

function draw() {
  let i = SCENES.length - 1;
  while (i > 0 && time < STARTS[i]) i--;
  const local = time - STARTS[i];
  ctx.save();
  RENDER[i](local, time);
  ctx.restore();
  // Short fade between scenes.
  const edge = Math.min(local, SCENES[i][0] - local);
  if (edge < 0.35) { ctx.fillStyle = `rgba(23,20,28,${1 - edge / 0.35})`; ctx.fillRect(0, 0, W, H); }
  if (i !== shownScene) { shownScene = i; capTitle.textContent = SCENES[i][1]; capText.textContent = SCENES[i][2]; }
  segs.forEach((s, k) => {
    s.classList.toggle("on", k === i);
    s.style.setProperty("--fill", (k < i ? 100 : k > i ? 0 : (local / SCENES[k][0]) * 100) + "%");
  });
  timeEl.textContent = `${fmt(Math.floor(time))} / ${fmt(total)}`;
}

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) {
    time += dt;
    if (time >= total) { time = total - 0.001; playing = false; playBtn.textContent = "Replay"; }
  }
  draw();
  requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => {
  if (time >= total - 0.01) time = 0;
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
});
const fullBtn = document.getElementById("full");
const player = document.getElementById("player");
function toggleFull() {
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (!player.requestFullscreen) { fullBtn.textContent = "Not supported here"; return; }
  player.requestFullscreen().catch(() => { fullBtn.textContent = "Not supported here"; });
}
fullBtn.addEventListener("click", toggleFull);
document.addEventListener("fullscreenchange", () => {
  fullBtn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  // Going fullscreen is the presentation: play it from the start.
  if (document.fullscreenElement) { time = 0; playing = true; playBtn.textContent = "Pause"; }
});
document.getElementById("restart").addEventListener("click", () => { time = 0; playing = true; playBtn.textContent = "Pause"; });
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && (e.target === document.body || e.target === player)) { e.preventDefault(); playBtn.click(); }
  if (e.key === "f" || e.key === "F") toggleFull();
});
playBtn.textContent = playing ? "Pause" : "Play";
fitCanvas();
window.addEventListener("resize", fitCanvas);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { petCache.clear(); });
requestAnimationFrame((n) => { last = n; tick(n); });
</script>
