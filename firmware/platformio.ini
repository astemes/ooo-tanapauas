; Arduino GIGA R1 WiFi (M7 core) + GIGA Display Shield.
; Build: pio run        Flash: pio run -t upload

[platformio]
default_envs = giga_r1_m7

[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino
lib_extra_dirs = ../lib
lib_deps =
    lvgl/lvgl@8.3.11
    arduino-libraries/ArduinoGraphics
    arduino-libraries/Arduino_GigaDisplayTouch
build_flags =
    -D LV_CONF_PATH=${PROJECT_DIR}/include/lv_conf.h
monitor_speed = 115200
